# Build + push the eqanun-notifier image to GHCR on push to main, then trigger
# the Coolify deploy webhook. Upgraded to the fleet-canonical fast-build pattern
# (mirrors forex-scalper/.github/workflows/deploy.yml): buildx + gha layer cache,
# docker/metadata-action for :latest + :sha-<long> tags, paths filter so docs/
# tweaks don't rebuild, and workflow_dispatch for manual runs.
#
# Tags pushed: ghcr.io/orzazade/eqanun-notifier:latest and :sha-<gitsha-long>.
# The :sha- tag is what the infra Flux ImagePolicy sha-migration (P2-2) would
# select for readable, revertable rollback if this service is ever moved to Flux.
name: CI/CD

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig*.json"
      - "nest-cli.json"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: {}

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=long

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Trigger Coolify deployment
        run: |
          curl -fsS --retry 3 -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}" "${{ secrets.COOLIFY_WEBHOOK }}"
